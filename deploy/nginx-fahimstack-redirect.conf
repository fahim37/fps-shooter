# Include inside the fahimstack.tech HTTPS server block: the game moved to https://fps.famstack.cloud.

# Tabs still open on the old address poll this between matches; a build id they can't be
# running makes them reload, which follows the redirect below.
location = /fps/version {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"build":"moved-to-fps.famstack.cloud"}';
}

# A match already running in an old tab keeps its connection.
location ^~ /fps/server/ {
    proxy_pass http://127.0.0.1:2567/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# Everything else, invite links included (?room=CODE is kept), moves for good.
location = /fps {
    return 301 https://fps.famstack.cloud/$is_args$args;
}

location ~ ^/fps/(?<rest>.*)$ {
    return 301 https://fps.famstack.cloud/$rest$is_args$args;
}

# Include inside the existing fahimstack.tech HTTPS server block.
# Serve immutable build assets directly, keeping download traffic off Node.js.
location ^~ /fps/_next/static/ {
    alias /var/www/fps-shooter/.next/static/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
}

# Model/environment filenames are stable across releases: revalidate their ETags
# instead of leaving players with an old model after the next deployment.
location ^~ /fps/models/ {
    alias /var/www/fps-shooter/public/models/;
    access_log off;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

location ^~ /fps/env/ {
    alias /var/www/fps-shooter/public/env/;
    access_log off;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

location = /fps {
    proxy_pass http://127.0.0.1:3006;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /fps/server/ {
    proxy_pass http://127.0.0.1:2567/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location ^~ /fps/ {
    proxy_pass http://127.0.0.1:3006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
